name: Stripe coverage sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-coverage-sandbox
  cancel-in-progress: false

jobs:
  contract:
    name: read coverage contract in Stripe test mode
    if: github.repository == 'getsotto/sotto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: stripe-coverage-sandbox
    env:
      SOTTO_RUN_STRIPE_SANDBOX_TESTS: "1"
      STRIPE_SANDBOX_READ_KEY: ${{ secrets.STRIPE_SANDBOX_READ_KEY }}
      STRIPE_SANDBOX_ACCOUNT_ID: ${{ secrets.STRIPE_SANDBOX_ACCOUNT_ID }}
      STRIPE_SANDBOX_CUSTOMER_ID: ${{ secrets.STRIPE_SANDBOX_CUSTOMER_ID }}
      STRIPE_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.STRIPE_SANDBOX_SUBSCRIPTION_ID }}
      STRIPE_SANDBOX_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_SANDBOX_MONTHLY_PRICE_ID }}
      STRIPE_SANDBOX_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_SANDBOX_ANNUAL_PRICE_ID }}
      STRIPE_SANDBOX_ALLOCATION_REFERENCE: ${{ secrets.STRIPE_SANDBOX_ALLOCATION_REFERENCE }}
      STRIPE_SANDBOX_PROVIDER_ITEM_ID: ${{ secrets.STRIPE_SANDBOX_PROVIDER_ITEM_ID }}
      STRIPE_SANDBOX_REPORT: ${{ runner.temp }}/stripe-sandbox-contract.json
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Run the bounded read contract
        run: cargo test -p sotto-server --test cloud_provider_stripe_sandbox -- --nocapture

      - name: Upload the sanitised compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-sandbox-contract
          path: ${{ runner.temp }}/stripe-sandbox-contract.json
          if-no-files-found: ignore
          retention-days: 30
